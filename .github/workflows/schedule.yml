# 森空岛自动签到（明日方舟 + 终末地）
# 基于 AEtherside/skland-daily-attendance
#
# 使用前提：本工作流必须放在「已经包含项目源码」的仓库里
# （即 fork 自 AEtherside/skland-daily-attendance，仓库根目录有 package.json / pnpm-lock.yaml）。
# 只把本文件拷到一个空仓库是无法运行的，因为 pnpm install / pnpm action 依赖项目源码。

name: attendance

on:
  schedule:
    # 注意：GitHub Actions 的 cron 使用 UTC 时间！
    # 30 0 * * *
    #   = 00:30 UTC = 北京时间 08:30（每天）
    # 想换时间就改这一行，对照表见 README：
    #   北京时间 08:00 -> '0 0 * * *'
    #   北京时间 08:30 -> '30 0 * * *'
    #   北京时间 00:00 -> '0 16 * * *'（上游默认，卡零点，不推荐）
    - cron: '30 0 * * *'
  # 允许在 Actions 页面手动点击运行，方便第一次测试
  workflow_dispatch:
  # 允许被其它工作流调用（保持与上游一致，可留可删）
  workflow_call:
    secrets:
      SKLAND_TOKENS:
        required: true
      SKLAND_NOTIFICATION_URLS:
        required: false
      SKLAND_ANONYMOUS:
        required: false
      SKLAND_MAX_RETRIES:
        required: false
    inputs:
      repository:
        description: The repository to run the workflow on
        default: AEtherside/skland-daily-attendance
        required: false
        type: string

jobs:
  attendance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository || github.repository }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install

      - name: Run daily attendance
        run: pnpm action
        env:
          SKLAND_TOKENS: ${{ secrets.SKLAND_TOKENS }}
          SKLAND_NOTIFICATION_URLS: ${{ secrets.SKLAND_NOTIFICATION_URLS }}
          SKLAND_MAX_RETRIES: ${{ secrets.SKLAND_MAX_RETRIES }}
          SKLAND_ANONYMOUS: ${{ secrets.SKLAND_ANONYMOUS }}

  # 防止仓库长期无活动导致 GitHub 自动停用 Actions（无需额外提交）
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
